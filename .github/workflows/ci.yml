name: app-host-core
on: [push, pull_request]
# Public source and fixed package archives require no repository/environment secrets.
permissions: {}
concurrency:
  group: app-host-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    # The existing native preparation contract requires macOS arm64.
    # macos-15 is a standard public/free runner, not a larger runner.
    runs-on: macos-15
    env:
      HM_CHROMIUM: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
      npm_config_manage_package_manager_versions: 'false'
      pnpm_config_manage_package_manager_versions: 'false'
      npm_config_update_notifier: 'false'
      COREPACK_ENABLE_AUTO_PIN: '0'
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_TERMINAL_PROMPT: '0'
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: credential.helper
      GIT_CONFIG_VALUE_0: ''
      GIT_CONFIG_KEY_1: credential.helper
      GIT_CONFIG_VALUE_1: '!gh auth git-credential'
    steps:
      - name: Initialize isolated directories
        run: |
          python3 - <<'PYTHON'
          import os, json
          from pathlib import Path
          # Existing native/producer fixtures require an owned root within this card.
          root = Path(os.environ['GITHUB_WORKSPACE']).parent / 'app-host-ci'
          settings = {'CI_ISOLATION_ROOT': root, 'HOME': root/'home', 'CFFIXED_USER_HOME': root/'home',
            'DSH_HOME': root/'dsh', 'CLAUDE_CONFIG_DIR': root/'claude', 'CODEX_HOME': root/'codex',
            'GH_CONFIG_DIR': root/'gh', 'XDG_CONFIG_HOME': root/'config', 'XDG_DATA_HOME': root/'data',
            'XDG_CACHE_HOME': root/'cache', 'TMPDIR': root/'tmp', 'npm_config_cache': root/'npm',
            'npm_config_store_dir': root/'store', 'HANAMESH_APPHOST_RUN_DIR': root/'evidence'}
          with open(os.environ['GITHUB_ENV'], 'a') as out:
            for key, value in settings.items():
              value.mkdir(mode=0o700, parents=True, exist_ok=True)
              (value/'.run-state.json').write_text(json.dumps({'state':'active','owner':'app-host-ci'}))
              out.write(f'{key}={value}\n')
          PYTHON
      - name: Fetch the public revision without credentials
        env:
          CI_REPOSITORY: ${{ github.repository }}
          CI_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          # No checkout token, persisted credentials, or Git helper is needed.
          curl --disable --fail --location "https://codeload.github.com/$CI_REPOSITORY/tar.gz/$CI_REVISION" --output "$CI_ISOLATION_ROOT/source.tar.gz"
          tar -xzf "$CI_ISOLATION_ROOT/source.tar.gz" --strip-components=1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.13.1'
          token: ''
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '10.33.0'
          run_install: false
      - name: Verify fixed packages and toolchain
        run: |
          shasum -a 256 --check vendor/SHA256SUMS
          node -e "if(process.version !== 'v24.13.1' || process.platform !== 'darwin' || process.arch !== 'arm64') process.exit(1)"
          test -x "$HM_CHROMIUM"
          test "$(pnpm --version)" = '10.33.0'
      - name: Install with the frozen pnpm lockfile
        run: node scripts/safe-git.mjs pnpm install --frozen-lockfile
      - name: Check provider public contracts
        run: |
          node scripts/safe-git.mjs pnpm run check:devkit-supply
          node scripts/safe-git.mjs pnpm run check:provision-supply
      - name: Full module checks including keychain guard regressions
        run: node scripts/safe-git.mjs pnpm run check
      - name: Pack, verify the isolated consumer and enforce platform closure
        run: |
          node scripts/safe-git.mjs pnpm pack --pack-destination "$CI_ISOLATION_ROOT"
          package_version=$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')
          node scripts/safe-git.mjs pnpm run verify:pack "$CI_ISOLATION_ROOT/hanamesh-dsh-app-host-$package_version.tgz"
      - name: Remove isolated runtime directories
        if: always()
        run: |
          if [ -n "${CI_ISOLATION_ROOT:-}" ]; then rm -rf -- "${CI_ISOLATION_ROOT:?}"; fi
